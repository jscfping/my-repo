<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>進位轉換</title>
</head>

<body>
    <label for="value">輸入數值</label>
    <textarea id="value" rows="3" wrap="off" autocomplete="off" spellcheck="false"></textarea>

    <table border="1">
        <thead>
            <tr>
                <th rowspan="2" scope="col">輸入框視為</th>
                <th colspan="3" scope="colgroup">轉為</th>
            </tr>
            <tr>
                <th scope="col">二進位</th>
                <th scope="col">十進位</th>
                <th scope="col">HEX</th>
            </tr>
        </thead>
        <tbody>
            <tr data-radix="2">
                <th scope="row">二進位</th>
                <td><textarea rows="3" readonly aria-label="二進位輸入轉為二進位"></textarea></td>
                <td><textarea rows="3" readonly aria-label="二進位輸入轉為十進位"></textarea></td>
                <td><textarea rows="3" readonly aria-label="二進位輸入轉為 HEX"></textarea></td>
            </tr>
            <tr data-radix="10">
                <th scope="row">十進位</th>
                <td><textarea rows="3" readonly aria-label="十進位輸入轉為二進位"></textarea></td>
                <td><textarea rows="3" readonly aria-label="十進位輸入轉為十進位"></textarea></td>
                <td><textarea rows="3" readonly aria-label="十進位輸入轉為 HEX"></textarea></td>
            </tr>
            <tr data-radix="16">
                <th scope="row">HEX</th>
                <td><textarea rows="3" readonly aria-label="HEX 輸入轉為二進位"></textarea></td>
                <td><textarea rows="3" readonly aria-label="HEX 輸入轉為十進位"></textarea></td>
                <td><textarea rows="3" readonly aria-label="HEX 輸入轉為 HEX"></textarea></td>
            </tr>
        </tbody>
    </table>

    <script>
        const valueInput = document.querySelector("#value");
        const rows = document.querySelectorAll("tbody tr");

        function parseValue(value, radix) {
            const match = value.trim().match(/^([+-]?)([0-9a-fA-F]+)$/);
            if (!match) return null;

            const digits = match[2];
            const validDigits = radix === 2
                ? /^[01]+$/.test(digits)
                : radix === 10
                    ? /^[0-9]+$/.test(digits)
                    : /^[0-9a-fA-F]+$/.test(digits);
            if (!validDigits) return null;

            const prefix = radix === 2 ? "0b" : radix === 16 ? "0x" : "";
            const number = BigInt(prefix + digits);
            return match[1] === "-" ? -number : number;
        }

        function updateConversions() {
            const cleanedValue = valueInput.value.toUpperCase().replace(/[^0-9A-F]/g, "");

            rows.forEach((row) => {
                const number = parseValue(cleanedValue, Number(row.dataset.radix));
                const results = number === null
                    ? ["", "", ""]
                    : [number.toString(2), number.toString(10), number.toString(16).toUpperCase()];

                row.querySelectorAll("textarea").forEach((output, index) => {
                    output.value = results[index];
                });
            });
        }

        valueInput.addEventListener("input", updateConversions);
    </script>
</body>

</html>
